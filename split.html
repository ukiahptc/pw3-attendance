<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>악보 분리 · PW3 예배팀</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💙</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<link rel="stylesheet" href="assets/site.css?v=20260902e">
</head>
<body>
<div id="app">
  <header class="top">
    <h1>
      <a href="index.html" class="wm" style="text-decoration:none"><span class="lp">P</span><span class="lw">W</span><span class="l3">3</span><span class="spark">✦</span></a>
      악보 분리
    </h1>
    <span id="saveStatus">불러오는 중…</span>
  </header>
  <p class="subtitle">콘티 악보 PDF를 곡마다 잘라 자료실에 아카이빙합니다</p>
  <div id="nav"></div>

  <section class="card">
    <h2>1. 악보 PDF 선택</h2>
    <div id="pick"></div>
  </section>

  <section class="card" id="step2" style="display:none">
    <h2>2. 곡 경계 지정 <span class="sub">곡이 시작되는 페이지를 체크하고 곡명을 입력</span></h2>
    <div id="pages" class="pages"></div>
    <div class="plan" id="plan"></div>
    <div class="row" style="margin-top:14px">
      <input type="date" id="fromDate" style="max-width:180px">
      <span class="uphint" style="margin:0">어느 콘티의 악보인지 (선택)</span>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="primary" id="go">나누어 업로드</button>
      <button class="ghost" id="reset">처음부터</button>
    </div>
    <div class="uphint" id="prog"></div>
  </section>

  <section class="card" id="done" style="display:none">
    <h2>완료</h2>
    <div id="result" class="list"></div>
    <div class="filebtns"><a class="filebtn" href="resources.html">자료실에서 보기</a></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="assets/site.js?v=20260902e"></script>
<script>
(function(){
"use strict";
var $ = function(s){ return document.querySelector(s); };
var esc = PW3.esc;
var MAX_PAGES = 60;
var state = PW3.normalize(null);
var unlocked = PW3.hasPin();
var srcBytes = null;      /* 원본 PDF 바이트 */
var pageCount = 0;
var marks = [];           /* [{start:bool, title:string}] */

$('#nav').innerHTML = PW3.navHTML('setlist');
function setStatus(t, cls){ var el=$('#saveStatus'); el.textContent=t; el.className=cls||''; }
function prog(t, cls){ var el=$('#prog'); el.textContent=t; el.className='uphint'+(cls?' '+cls:''); }

if(window.pdfjsLib){
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
}

/* ---------- 1. 파일 선택 ---------- */
function renderPick(){
  var box = $('#pick');
  if(!unlocked){
    box.innerHTML = '<button id="unlock">시작하기 (PIN)</button>';
    $('#unlock').addEventListener('click', function(){
      PW3.inlinePin(box, function(){ unlocked = true; renderPick(); }, function(){ renderPick(); });
    });
    return;
  }
  box.innerHTML =
    '<label class="filepick" for="f">악보 PDF 선택</label>'+
    '<input type="file" id="f" accept="application/pdf" style="display:none">'+
    '<div class="uphint" id="pickHint">한 PDF 안에 여러 곡이 들어 있는 콘티 악보를 넣으세요. 20MB까지.</div>';
  $('#f').addEventListener('change', function(){
    var file = this.files && this.files[0];
    if(!file) return;
    if(file.size > 20*1024*1024){
      $('#pickHint').className = 'uphint err';
      $('#pickHint').textContent = '파일이 20MB를 넘습니다.';
      return;
    }
    $('#pickHint').className = 'uphint';
    $('#pickHint').textContent = file.name + ' — 페이지를 그리는 중…';
    var fr = new FileReader();
    fr.onload = function(){ loadPdf(new Uint8Array(fr.result), file.name); };
    fr.onerror = function(){ $('#pickHint').className='uphint err'; $('#pickHint').textContent='파일을 읽지 못했습니다.'; };
    fr.readAsArrayBuffer(file);
  });
}

/* ---------- 2. 페이지 렌더 ---------- */
function loadPdf(bytes, name){
  srcBytes = bytes;
  pdfjsLib.getDocument({data: bytes.slice()}).promise.then(function(pdf){
    pageCount = Math.min(pdf.numPages, MAX_PAGES);
    marks = [];
    for(var i=0;i<pageCount;i++) marks.push({start: i===0, title: i===0 ? stripExt(name) : ''});
    $('#pages').innerHTML = '';
    $('#step2').style.display = '';
    $('#pickHint').textContent = name + ' — 총 ' + pdf.numPages + '페이지' +
      (pdf.numPages > MAX_PAGES ? ' (앞 ' + MAX_PAGES + '페이지만 표시)' : '');
    var chain = Promise.resolve();
    for(var p=1;p<=pageCount;p++) chain = chain.then(makeRenderer(pdf, p));
    chain.then(function(){ renderPlan(); });
  }).catch(function(){
    $('#pickHint').className = 'uphint err';
    $('#pickHint').textContent = 'PDF를 여는 데 실패했습니다.';
  });
}
function stripExt(n){ return String(n||'').replace(/\.pdf$/i, ''); }
function makeRenderer(pdf, num){
  return function(){
    return pdf.getPage(num).then(function(page){
      var vp = page.getViewport({scale: 1});
      var scale = 260 / vp.width;
      var v = page.getViewport({scale: scale});
      var canvas = document.createElement('canvas');
      canvas.width = Math.floor(v.width); canvas.height = Math.floor(v.height);
      var div = document.createElement('div');
      div.className = 'page' + (marks[num-1].start ? ' start' : '');
      div.id = 'pg' + num;
      div.appendChild(canvas);
      var meta = document.createElement('div');
      meta.innerHTML =
        '<div class="pno">'+num+'페이지</div>'+
        '<label class="ck"><input type="checkbox" data-st="'+num+'"'+(marks[num-1].start?' checked':'')+
          (num===1?' disabled':'')+'> 여기서 새 곡 시작</label>'+
        '<input type="text" data-ti="'+num+'" placeholder="곡 제목" value="'+esc(marks[num-1].title)+'"'+
          (marks[num-1].start?'':' style="display:none"')+'>';
      div.appendChild(meta);
      $('#pages').appendChild(div);
      bind(num);
      return page.render({canvasContext: canvas.getContext('2d'), viewport: v}).promise;
    });
  };
}
function bind(num){
  var ck = document.querySelector('[data-st="'+num+'"]');
  var ti = document.querySelector('[data-ti="'+num+'"]');
  ck.addEventListener('change', function(){
    marks[num-1].start = ck.checked;
    ti.style.display = ck.checked ? '' : 'none';
    $('#pg'+num).className = 'page' + (ck.checked ? ' start' : '');
    if(ck.checked) ti.focus();
    renderPlan();
  });
  ti.addEventListener('input', function(){ marks[num-1].title = ti.value; renderPlan(); });
}

/* ---------- 구간 계산 ---------- */
function segments(){
  var segs = [], cur = null;
  for(var i=0;i<pageCount;i++){
    if(marks[i].start){
      if(cur) segs.push(cur);
      cur = { title: (marks[i].title||'').trim(), from: i+1, to: i+1 };
    } else if(cur){ cur.to = i+1; }
  }
  if(cur) segs.push(cur);
  return segs;
}
function renderPlan(){
  var segs = segments();
  $('#plan').textContent = segs.length
    ? segs.map(function(s, i){
        return (i+1)+'. '+(s.title || '(곡명 미입력)')+' — '+
               (s.from === s.to ? s.from+'페이지' : s.from+'–'+s.to+'페이지');
      }).join('\n')
    : '곡 시작 페이지를 체크해 주세요.';
}

/* ---------- 3. 분리 + 업로드 ---------- */
$('#go').addEventListener('click', function(){
  var segs = segments();
  if(!segs.length){ prog('곡 시작 페이지를 체크해 주세요.','err'); return; }
  var missing = segs.filter(function(s){ return !s.title; });
  if(missing.length){ prog('곡명을 입력하지 않은 구간이 '+missing.length+'개 있습니다.','err'); return; }
  $('#go').disabled = true;
  runSplit(segs);
});
$('#reset').addEventListener('click', function(){ location.reload(); });

function runSplit(segs){
  var made = [];
  var fromDate = $('#fromDate').value;
  PDFLib.PDFDocument.load(srcBytes).then(function(src){
    var chain = Promise.resolve();
    segs.forEach(function(seg, idx){
      chain = chain.then(function(){
        prog('('+(idx+1)+'/'+segs.length+') '+seg.title+' 처리 중…');
        return PDFLib.PDFDocument.create().then(function(out){
          var idxs = [];
          for(var p=seg.from; p<=seg.to; p++) idxs.push(p-1);
          return out.copyPages(src, idxs).then(function(pages){
            pages.forEach(function(pg){ out.addPage(pg); });
            return out.save();
          });
        }).then(function(bytes){
          return new Promise(function(resolve){
            PW3.uploadFile({name: seg.title + '.pdf', bytes: bytes}, '곡별 악보', function(err, res){
              if(err){ made.push({title: seg.title, error: PW3.uploadError(err)}); }
              else { made.push({title: seg.title, url: res.url, name: res.name, pages: seg.from+'–'+seg.to}); }
              resolve();
            });
          });
        });
      });
    });
    return chain;
  }).then(function(){
    var ok = made.filter(function(m){ return m.url; });
    ok.forEach(function(m){
      state.resources.push({
        id: PW3.uid(), cat: '곡별 악보', title: m.title, url: m.url,
        memo: (fromDate ? PW3.dateLabel(fromDate)+' 콘티' : '') , at: Date.now()
      });
    });
    if(!ok.length){ prog('업로드된 파일이 없습니다.','err'); $('#go').disabled = false; return; }
    prog('자료실에 등록하는 중…');
    PW3.saveSection({resources: state.resources}, function(err){
      $('#go').disabled = false;
      if(err){ prog('자료실 등록 실패 — 파일은 드라이브에 올라갔습니다.','err'); setStatus('저장 실패','err'); return; }
      prog('');
      setStatus('저장됨');
      $('#done').style.display = '';
      $('#result').innerHTML = made.map(function(m){
        return '<div class="item"><div>'+
          '<div class="t">'+esc(m.title)+'</div>'+
          '<div class="m">'+(m.url
            ? '<a href="'+esc(m.url)+'" target="_blank" rel="noopener noreferrer">링크 열기</a> · '+esc(m.pages)+'페이지'
            : '<span style="color:var(--bad);font-weight:700">'+esc(m.error)+'</span>')+
          '</div></div></div>';
      }).join('');
      $('#done').scrollIntoView({behavior:'smooth'});
    });
  }).catch(function(){
    $('#go').disabled = false;
    prog('PDF를 나누는 중 오류가 났습니다.','err');
  });
}

PW3.load(function(err, s){
  state = s;
  setStatus(err ? '오프라인' : '저장됨', err ? 'err' : '');
  renderPick();
});
})();
</script>
</body>
</html>
