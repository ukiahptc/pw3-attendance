<body>
<div id="app">
  <header class="top">
    <h1>
      <a href="index.html" class="wm" style="text-decoration:none"><span class="lp">P</span><span class="lw">W</span><span class="l3">3</span><span class="spark">✦</span></a>
      악보 분리
    </h1>
    <span id="saveStatus">불러오는 중…</span>
  </header>
  <p class="subtitle">콘티 악보 PDF를 곡마다 잘라 자료실과 찬양보관함에 아카이빙합니다</p>
  <div id="nav"></div>

  <section class="card">
    <h2>1. 악보 PDF 선택</h2>
    <div id="pick"></div>
  </section>

  <section class="card" id="step2" style="display:none">
    <h2>2. 곡 경계 지정 <span class="sub">곡이 시작되는 페이지를 체크하고 곡명을 입력</span></h2>
    <div id="contiInfo"></div>
    <datalist id="contiList"></datalist>
    <div class="row" style="margin-top:12px">
      <button class="primary" id="ocrGo" disabled>🔍 자동 인식</button>
      <span class="uphint" id="ocrHint" style="margin:0">페이지 윗부분의 글자를 읽어 곡 시작·제목·키를 미리 채웁니다. 처음 한 번은 인식 데이터를 내려받아 조금 걸립니다.</span>
    </div>
    <div id="pages" class="pages"></div>
    <div class="plan" id="plan"></div>
    <div class="row" style="margin-top:14px">
      <input type="date" id="fromDate" style="max-width:180px">
      <span class="uphint" style="margin:0">어느 콘티의 악보인지 (선택)</span>
    </div>
    <div style="margin-top:14px">
      <label style="display:flex;align-items:center;gap:8px;font-size:.88rem;font-weight:700;cursor:pointer">
        <input type="checkbox" id="toArchive" checked> 찬양보관함에도 등록
      </label>
      <div class="uphint" style="margin-top:4px">키를 고른 곡만 들어갑니다. 같은 곡에 같은 키 악보가 이미 있으면 건너뜁니다.</div>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="primary" id="go">나누어 업로드</button>
      <button class="ghost" id="reset">처음부터</button>
    </div>
    <div class="uphint" id="prog"></div>
  </section>

  <section class="card" id="done" style="display:none">
    <h2>완료</h2>
    <div id="result" class="list"></div>
    <div class="filebtns"><a class="filebtn" href="resources.html">자료실에서 보기</a><a class="filebtn" id="archiveLink" href="https://ukiahptc.github.io/praise-archive/" target="_blank" rel="noopener noreferrer">찬양보관함 열기</a></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="assets/site.js?v=20261011a"></script>
<script src="assets/ocr.js?v=20261011a"></script>
<script src="assets/archive.js?v=20261011a"></script>
<script>
(function(){
"use strict";
var $ = function(s){ return document.querySelector(s); };
var esc = PW3.esc;
var MAX_PAGES = 60;
var state = PW3.normalize(null);
var unlocked = PW3.hasPin();
var srcBytes = null;      /* 원본 PDF 바이트 */
var pageCount = 0;
var marks = [];           /* [{start:bool, title:string, key:string, manual:bool}] */
var pdfDoc = null;        /* pdf.js 문서 (자동 인식에서 다시 읽는다) */
var ocrBusy = false;
var TESS_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
var OCR_WIDTH = 1400;     /* 인식용 렌더 폭(px). 페이지 위쪽만 그린다 */
var OCR_TOP = 0.4;
var contiSongs = [];      /* 불러온 콘티의 곡 제목 (순서대로). 시작 페이지를 체크하면 차례로 채워진다 */
var contiDate = '';
var contiId = '';

$('#nav').innerHTML = PW3.navHTML('setlist');
function setStatus(t, cls){ var el=$('#saveStatus'); el.textContent=t; el.className=cls||''; }
function prog(t, cls){ var el=$('#prog'); el.textContent=t; el.className='uphint'+(cls?' '+cls:''); }

if(window.pdfjsLib){
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
}

/* ---------- 1. 파일 선택 ---------- */
function renderPick(){
  var box = $('#pick');
  if(!unlocked){
    box.innerHTML = '<button id="unlock">시작하기 (PIN)</button>';
    $('#unlock').addEventListener('click', function(){
      /* PIN 통과 후에는 데이터를 다시 받아야 한다 */
      PW3.inlinePin(box, function(){ location.reload(); }, function(){ renderPick(); });
    });
    return;
  }
  box.innerHTML =
    contiListHTML()+
    '<div class="row">'+
      '<label class="filepick" for="f">악보 PDF 직접 선택</label>'+
      '<input type="file" id="f" accept="application/pdf" style="display:none">'+
    '</div>'+
    '<div class="uphint" id="pickHint">한 PDF 안에 여러 곡이 들어 있는 콘티 악보를 넣으세요. 20MB까지.</div>';
  Array.prototype.forEach.call(box.querySelectorAll('[data-conti]'), function(b){
    b.addEventListener('click', function(){ pickConti(b.dataset.conti); });
  });
  $('#f').addEventListener('change', function(){
    var file = this.files && this.files[0];
    if(!file) return;
    if(file.size > 20*1024*1024){
      hint('파일이 20MB를 넘습니다.', 'err');
      return;
    }
    hint(file.name + ' — 페이지를 그리는 중…');
    var fr = new FileReader();
    fr.onload = function(){ loadPdf(new Uint8Array(fr.result), file.name); };
    fr.onerror = function(){ hint('파일을 읽지 못했습니다.', 'err'); };
    fr.readAsArrayBuffer(file);
  });
}
function hint(t, cls){ var el=$('#pickHint'); if(!el) return; el.textContent=t; el.className='uphint'+(cls?' '+cls:''); }

/* 최근 콘티 목록. 악보 링크가 있는 콘티는 바로 불러오고,
   링크가 없는 콘티는 곡 제목·날짜만 가져온 뒤 파일을 직접 고르게 한다 */
var CONTI_MAX = 8;
function recentSetlists(){
  return state.setlists.slice()
    .sort(function(a,b){ return a.date < b.date ? 1 : -1; })
    .slice(0, CONTI_MAX);
}
function contiListHTML(){
  var ls = recentSetlists();
  if(!ls.length) return '';
  return '<div class="uphint" style="margin:0 0 8px">콘티에서 불러오기 — 악보와 곡 제목을 한 번에 가져옵니다</div>'+
    '<div class="list" style="margin-bottom:14px">'+
    ls.map(function(sl){
      var titles = (sl.songs||[]).map(function(x){ return x.title; }).join(' · ');
      var has = !!PW3.driveFileId(sl.scoreUrl);
      return '<div class="item"><div>'+
          '<div class="t">'+esc(PW3.dateLabel(sl.date))+' 콘티</div>'+
          '<div class="m">'+esc(titles || '곡 없음')+(has ? '' : (sl.scoreUrl ? ' · 외부 링크(직접 선택 필요)' : ' · 악보 없음(직접 선택 필요)'))+'</div>'+
        '</div>'+
        '<button data-conti="'+esc(sl.id)+'">'+(has ? '불러오기' : '곡 제목만')+'</button>'+
      '</div>';
    }).join('')+'</div>';
}
function findSetlist(id){
  for(var i=0;i<state.setlists.length;i++) if(state.setlists[i].id===id) return state.setlists[i];
  return null;
}
function pickConti(id){
  var sl = findSetlist(id);
  if(!sl) return;
  contiId = sl.id;
  contiDate = sl.date;
  contiSongs = (sl.songs||[]).map(function(x){ return String(x.title||'').trim(); }).filter(Boolean);
  var fid = PW3.driveFileId(sl.scoreUrl);
  if(!fid){
    hint(PW3.dateLabel(sl.date)+' 콘티의 곡 '+contiSongs.length+'개를 가져왔습니다. 악보 PDF를 직접 선택해 주세요.', 'ok');
    return;
  }
  Array.prototype.forEach.call(document.querySelectorAll('[data-conti]'), function(b){ b.disabled = true; });
  hint(PW3.dateLabel(sl.date)+' 콘티 악보를 받는 중…');
  PW3.downloadFile(fid, function(err, res){
    Array.prototype.forEach.call(document.querySelectorAll('[data-conti]'), function(b){ b.disabled = false; });
    if(err){
      hint(PW3.downloadError(err) + ' — 곡 제목 '+contiSongs.length+'개는 가져왔습니다.', 'err');
      return;
    }
    hint(res.name + ' — 페이지를 그리는 중…');
    loadPdf(res.bytes, res.name);
  }, function(done, total){
    if(total > 1) hint(PW3.dateLabel(sl.date)+' 콘티 악보를 받는 중… ('+done+'/'+total+')');
  });
}

/* ---------- 2. 페이지 렌더 ---------- */
function loadPdf(bytes, name){
  srcBytes = bytes;
  pdfjsLib.getDocument({data: bytes.slice()}).promise.then(function(pdf){
    pdfDoc = pdf;
    pageCount = Math.min(pdf.numPages, MAX_PAGES);
    marks = [];
    for(var i=0;i<pageCount;i++) marks.push({start: i===0, title: '', key: '', manual: false});
    if(!contiSongs.length) marks[0] = {start:true, title: stripExt(name), key:'', manual: true};
    autoTitles();
    $('#pages').innerHTML = '';
    $('#step2').style.display = '';
    renderContiInfo();
    if(contiDate) $('#fromDate').value = contiDate;
    hint(name + ' — 총 ' + pdf.numPages + '페이지' +
      (pdf.numPages > MAX_PAGES ? ' (앞 ' + MAX_PAGES + '페이지만 표시)' : ''));
    var chain = Promise.resolve();
    for(var p=1;p<=pageCount;p++) chain = chain.then(makeRenderer(pdf, p));
    chain.then(function(){ renderPlan(); $('#ocrGo').disabled = false; });
  }).catch(function(){
    hint('PDF를 여는 데 실패했습니다.', 'err');
  });
}
/* 콘티 곡 목록을 2단계 위에 보여 주고, 곡명 입력칸의 자동완성 목록으로도 넣는다 */
function renderContiInfo(){
  var box = $('#contiInfo');
  if(!contiSongs.length){ box.innerHTML = ''; $('#contiList').innerHTML = ''; return; }
  box.innerHTML = '<div class="uphint" style="margin:0">'+
    esc(PW3.dateLabel(contiDate))+' 콘티 곡 순서: '+
    contiSongs.map(function(t, i){ return (i+1)+'. '+esc(t); }).join(' · ')+
    '<br>시작 페이지를 체크하면 이 순서대로 곡명이 채워집니다. 다르면 고쳐 쓰세요.</div>';
  $('#contiList').innerHTML = contiSongs.map(function(t){ return '<option value="'+esc(t)+'">'; }).join('');
}
/* 체크된 시작 페이지에 콘티 곡 제목을 순서대로 넣는다. 손으로 고친 칸은 건드리지 않는다 */
function autoTitles(){
  if(!contiSongs.length) return;
  var k = 0;
  for(var i=0;i<pageCount;i++){
    if(!marks[i].start) continue;
    if(!marks[i].manual) marks[i].title = contiSongs[k] || '';
    k++;
    var ti = document.querySelector('[data-ti="'+(i+1)+'"]');
    if(ti && !marks[i].manual) ti.value = marks[i].title;
  }
}
function stripExt(n){ return String(n||'').replace(/\.pdf$/i, ''); }
function makeRenderer(pdf, num){
  return function(){
    return pdf.getPage(num).then(function(page){
      var vp = page.getViewport({scale: 1});
      var scale = 260 / vp.width;
      var v = page.getViewport({scale: scale});
      var canvas = document.createElement('canvas');
      canvas.width = Math.floor(v.width); canvas.height = Math.floor(v.height);
      var div = document.createElement('div');
      div.className = 'page' + (marks[num-1].start ? ' start' : '');
      div.id = 'pg' + num;
      div.appendChild(canvas);
      var meta = document.createElement('div');
      meta.innerHTML =
        '<div class="pno">'+num+'페이지</div>'+
        '<label class="ck"><input type="checkbox" data-st="'+num+'"'+(marks[num-1].start?' checked':'')+
          (num===1?' disabled':'')+'> 여기서 새 곡 시작</label>'+
        '<input type="text" data-ti="'+num+'" list="contiList" placeholder="곡 제목" value="'+esc(marks[num-1].title)+'"'+
          (marks[num-1].start?'':' style="display:none"')+'>'+
        '<select data-key="'+num+'" style="margin-top:6px;font-size:.82rem;padding:7px 9px'+(marks[num-1].start?'':';display:none')+'">'+
          '<option value="">키 (선택)</option>'+
          PW3OCR.KEYS.map(function(k){ return '<option value="'+k+'"'+(marks[num-1].key===k?' selected':'')+'>'+k.replace(/b/g,'♭').replace(/#/g,'♯')+'</option>'; }).join('')+
        '</select>'+
        '<div class="uphint" data-on="'+num+'" style="margin-top:4px;min-height:0"></div>';
      div.appendChild(meta);
      $('#pages').appendChild(div);
      bind(num);
      return page.render({canvasContext: canvas.getContext('2d'), viewport: v}).promise;
    });
  };
}
function bind(num){
  var ck = document.querySelector('[data-st="'+num+'"]');
  var ti = document.querySelector('[data-ti="'+num+'"]');
  var ke = document.querySelector('[data-key="'+num+'"]');
  ke.addEventListener('change', function(){ marks[num-1].key = ke.value; renderPlan(); });
  ck.addEventListener('change', function(){
    marks[num-1].start = ck.checked;
    if(!ck.checked){ marks[num-1].manual = false; marks[num-1].title = ''; ti.value = ''; marks[num-1].key = ''; ke.value = ''; }
    ti.style.display = ck.checked ? '' : 'none';
    ke.style.display = ck.checked ? '' : 'none';
    $('#pg'+num).className = 'page' + (ck.checked ? ' start' : '');
    autoTitles();
    if(ck.checked && !ti.value) ti.focus();
    renderPlan();
  });
  ti.addEventListener('input', function(){
    marks[num-1].title = ti.value;
    marks[num-1].manual = ti.value.trim() !== '';   /* 비우면 다시 자동 채움 대상 */
    autoTitles();
    renderPlan();
  });
}

/* ---------- 자동 인식 ---------- */
/* 페이지마다 먼저 PDF 텍스트 레이어를 읽고, 쓸 만한 글자가 없으면(스캔·사진 PDF)
   페이지 위쪽만 그려서 Tesseract로 읽는다. 읽힌 줄 목록은 PW3OCR.decide가 판정한다. */
function ocrHint(t, cls){ var el=$('#ocrHint'); el.textContent=t; el.className='uphint'+(cls?' '+cls:''); }
function pageNote(num, t, cls){ var el=document.querySelector('[data-on="'+num+'"]'); if(el){ el.textContent=t; el.className='uphint'+(cls?' '+cls:''); } }

function loadScript(url){
  return new Promise(function(res, rej){
    var s = document.createElement('script');
    s.src = url; s.onload = res; s.onerror = function(){ rej(new Error('script')); };
    document.head.appendChild(s);
  });
}
var tessWorker = null;
function getWorker(onStatus){
  if(tessWorker) return Promise.resolve(tessWorker);
  var p = window.Tesseract ? Promise.resolve() : loadScript(TESS_URL);
  return p.then(function(){
    return Tesseract.createWorker(['kor','eng'], 1, {
      logger: function(m){
        if(!onStatus || !m || !m.status) return;
        if(/loading|initializ/i.test(m.status)) onStatus('인식 데이터 준비 중… ' + (m.progress ? Math.round(m.progress*100)+'%' : ''));
      }
    });
  }).then(function(w){ tessWorker = w; return w; });
}
function textLayerLines(num){
  return pdfDoc.getPage(num).then(function(page){
    var H = page.getViewport({scale:1}).height;
    return page.getTextContent().then(function(tc){
      return { lines: PW3OCR.linesFromPdfText(tc, H), pageHeight: H };
    });
  });
}
function ocrLines(num, onStatus){
  return pdfDoc.getPage(num).then(function(page){
    var vp1 = page.getViewport({scale:1});
    var vp = page.getViewport({scale: OCR_WIDTH / vp1.width});
    var c = document.createElement('canvas');
    c.width = Math.floor(vp.width); c.height = Math.floor(vp.height * OCR_TOP);   /* 위쪽만 그린다 */
    return page.render({canvasContext: c.getContext('2d'), viewport: vp}).promise.then(function(){
      return getWorker(onStatus);
    }).then(function(w){
      return w.recognize(c, {}, {text:true, blocks:true});
    }).then(function(res){
      return { lines: PW3OCR.linesFromTesseract(res && res.data), pageHeight: c.height / OCR_TOP };
    });
  });
}
function runOCR(){
  if(ocrBusy || !pdfDoc) return;
  ocrBusy = true;
  $('#ocrGo').disabled = true;
  var pages = [], usedOcr = 0;
  var chain = Promise.resolve();
  for(var n=1; n<=pageCount; n++) chain = chain.then(readerFor(n));
  function readerFor(num){
    return function(){
      ocrHint('('+num+'/'+pageCount+') '+num+'페이지 읽는 중…');
      pageNote(num, '읽는 중…');
      return textLayerLines(num).then(function(r){
        if(PW3OCR.textLayerUsable(r.lines)) return r;
        usedOcr++;
        return ocrLines(num, function(t){ ocrHint('('+num+'/'+pageCount+') '+t); });
      }).catch(function(){ return { lines: [], pageHeight: 0 }; })
        .then(function(r){ pages.push(r); pageNote(num, ''); });
    };
  }
  chain.then(function(){
    window.PW3_OCR_LAST = pages;   /* 인식이 이상할 때 개발자 도구에서 읽힌 줄을 확인하는 용도 */
    applyOCR(PW3OCR.decide(pages, contiSongs), usedOcr);
  }).catch(function(err){
    ocrHint('자동 인식에 실패했습니다' + (err && err.message ? ' — ' + err.message : '') + '. 손으로 지정해 주세요.', 'err');
  }).then(function(){
    ocrBusy = false;
    $('#ocrGo').disabled = false;
    if(tessWorker){ var w = tessWorker; tessWorker = null; try{ w.terminate(); }catch(e){} }
  });
}
/* 판정 결과를 체크박스·제목·키에 반영한다. 자동으로 채운 제목은 '손으로 고친 것'으로 표시해
   이후 체크 변경 때 순서 채움이 덮어쓰지 않게 한다 (비우면 다시 자동) */
function applyOCR(results, usedOcr){
  var starts = 0, keys = 0, unsure = 0;
  results.forEach(function(r, i){
    var num = i+1;
    var ck = document.querySelector('[data-st="'+num+'"]');
    var ti = document.querySelector('[data-ti="'+num+'"]');
    var ke = document.querySelector('[data-key="'+num+'"]');
    var start = num === 1 ? true : r.start;
    var title = start ? (r.title || r.suggest || '') : '';
    marks[i] = { start: start, title: title, key: start ? (r.key||'') : '', manual: !!title };
    ck.checked = start;
    ti.value = title; ti.style.display = start ? '' : 'none';
    ke.value = marks[i].key; ke.style.display = start ? '' : 'none';
    $('#pg'+num).className = 'page' + (start ? ' start' : '');
    if(start){
      starts++;
      if(r.key) keys++;
      var how = r.matched ? '콘티 곡과 일치' : (r.title ? '제목 줄 인식' : (r.suggest ? '콘티 순서로 추정' : '제목 못 읽음'));
      if(!title) unsure++;
      pageNote(num, '자동: ' + how + (r.key ? ' · 키 ' + r.key : ''), r.matched ? 'ok' : '');
    } else {
      pageNote(num, r.note ? '자동: ' + r.note : '');
    }
  });
  renderPlan();
  var extra = contiSongs.length && starts !== contiSongs.length
    ? ' · 콘티 곡 수(' + contiSongs.length + ')와 다릅니다. 확인해 주세요' : '';
  ocrHint('자동 인식 완료 — 곡 ' + starts + '개' + (keys ? ', 키 ' + keys + '개' : '') +
    (usedOcr ? ' (OCR ' + usedOcr + '쪽)' : ' (PDF 글자 레이어 사용)') + extra +
    (unsure ? ' · 제목을 못 읽은 곡 ' + unsure + '개는 직접 입력' : '') + '. 아래에서 확인·수정 후 나누어 업로드하세요.', extra || unsure ? '' : 'ok');
}
$('#ocrGo').addEventListener('click', runOCR);

/* ---------- 구간 계산 ---------- */
function segments(){
  var segs = [], cur = null;
  for(var i=0;i<pageCount;i++){
    if(marks[i].start){
      if(cur) segs.push(cur);
      cur = { title: (marks[i].title||'').trim(), key: marks[i].key||'', from: i+1, to: i+1 };
    } else if(cur){ cur.to = i+1; }
  }
  if(cur) segs.push(cur);
  return segs;
}
function renderPlan(){
  var segs = segments();
  $('#plan').textContent = segs.length
    ? segs.map(function(s, i){
        return (i+1)+'. '+(s.title || '(곡명 미입력)')+(s.key ? ' ['+s.key.replace(/b/g,'♭').replace(/#/g,'♯')+']' : '')+' — '+
               (s.from === s.to ? s.from+'페이지' : s.from+'–'+s.to+'페이지');
      }).join('\n')
    : '곡 시작 페이지를 체크해 주세요.';
}

/* ---------- 3. 분리 + 업로드 ---------- */
/* 보관함 등록 체크는 기기에 기억한다 */
try{ if(localStorage.getItem('pw3-archive') === '0') $('#toArchive').checked = false; }catch(e){}
$('#toArchive').addEventListener('change', function(){
  try{ localStorage.setItem('pw3-archive', this.checked ? '1' : '0'); }catch(e){}
});
$('#go').addEventListener('click', function(){
  var segs = segments();
  if(!segs.length){ prog('곡 시작 페이지를 체크해 주세요.','err'); return; }
  var missing = segs.filter(function(s){ return !s.title; });
  if(missing.length){ prog('곡명을 입력하지 않은 구간이 '+missing.length+'개 있습니다.','err'); return; }
  $('#go').disabled = true;
  runSplit(segs);
});
$('#reset').addEventListener('click', function(){ location.reload(); });

function runSplit(segs){
  var made = [];
  var fromDate = $('#fromDate').value || contiDate;
  var toArchive = $('#toArchive').checked;
  var archiveSongs = null, archiveErr = null;   /* 보관함 곡 목록. 못 받으면 보관함 등록은 전부 실패 처리 */
  var prep = toArchive
    ? PW3ARCHIVE.listSongs().then(function(list){ archiveSongs = list; })
        .catch(function(err){ archiveErr = err; })
    : Promise.resolve();
  function archive(seg, bytes){
    if(!toArchive) return Promise.resolve(null);
    if(archiveErr) return Promise.resolve({ error: '보관함 목록을 못 받아 넣지 않음 — ' + archiveErr.message });
    return PW3ARCHIVE.register(archiveSongs, seg.title, seg.key, bytes)
      .catch(function(err){ return { error: '보관함 등록 실패 — ' + (err && err.message || err) }; });
  }
  prep.then(function(){ return PDFLib.PDFDocument.load(srcBytes); }).then(function(src){
    var chain = Promise.resolve();
    segs.forEach(function(seg, idx){
      chain = chain.then(function(){
        prog('('+(idx+1)+'/'+segs.length+') '+seg.title+' 처리 중…');
        return PDFLib.PDFDocument.create().then(function(out){
          var idxs = [];
          for(var p=seg.from; p<=seg.to; p++) idxs.push(p-1);
          return out.copyPages(src, idxs).then(function(pages){
            pages.forEach(function(pg){ out.addPage(pg); });
            return out.save();
          });
        }).then(function(bytes){
          return new Promise(function(resolve){
            PW3.uploadFile({name: seg.title + '.pdf', bytes: bytes}, '곡별 악보', function(err, res){
              if(err){ made.push({title: seg.title, error: PW3.uploadError(err)}); resolve(); return; }
              var m = {title: seg.title, key: seg.key, url: res.url, name: res.name,
                       pages: seg.from === seg.to ? String(seg.from) : seg.from+'–'+seg.to};
              made.push(m);
              /* 드라이브에 올라간 뒤 같은 바이트를 보관함에도 넣는다. 보관함 실패는 드라이브 결과를 막지 않는다 */
              archive(seg, bytes).then(function(a){ m.archive = a; resolve(); });
            });
          });
        });
      });
    });
    return chain;
  }).then(function(){
    var ok = made.filter(function(m){ return m.url; });
    ok.forEach(function(m){
      state.resources.push({
        id: PW3.uid(), cat: '곡별 악보', title: m.title, url: m.url,
        memo: [fromDate ? PW3.dateLabel(fromDate)+' 콘티' : '', m.key ? m.key+' 키' : ''].filter(Boolean).join(' · '), at: Date.now()
      });
    });
    if(!ok.length){ prog('업로드된 파일이 없습니다.','err'); $('#go').disabled = false; return; }
    prog('자료실에 등록하는 중…');
    PW3.saveSection({resources: state.resources}, function(err){
      $('#go').disabled = false;
      if(err){ prog('자료실 등록 실패 — 파일은 드라이브에 올라갔습니다.','err'); setStatus('저장 실패','err'); return; }
      prog('');
      setStatus('저장됨');
      $('#done').style.display = '';
      $('#result').innerHTML = made.map(function(m){
        var a = m.archive, aHtml = '';
        if(a && a.error) aHtml = '<div class="m"><span style="color:var(--bad);font-weight:700">'+esc(a.error)+'</span></div>';
        else if(a) aHtml = '<div class="m">'+esc(PW3ARCHIVE.statusText(a))+
          (a.url ? ' · <a href="'+esc(a.url)+'" target="_blank" rel="noopener noreferrer">보관함에서 보기</a>' : '')+'</div>';
        return '<div class="item"><div>'+
          '<div class="t">'+esc(m.title)+(m.key ? ' <span class="sub">'+esc(m.key.replace(/b/g,'♭').replace(/#/g,'♯'))+'</span>' : '')+'</div>'+
          '<div class="m">'+(m.url
            ? '<a href="'+esc(m.url)+'" target="_blank" rel="noopener noreferrer">드라이브 링크</a> · '+esc(m.pages)+'페이지'
            : '<span style="color:var(--bad);font-weight:700">'+esc(m.error)+'</span>')+
          '</div>'+aHtml+'</div></div>';
      }).join('');
      $('#done').scrollIntoView({behavior:'smooth'});
    });
  }).catch(function(){
    $('#go').disabled = false;
    prog('PDF를 나누는 중 오류가 났습니다.','err');
  });
}

PW3.load(function(err, s){
  state = s;
  setStatus(err ? '오프라인' : '저장됨', err ? 'err' : '');
  renderPick();
});
})();
</script>
