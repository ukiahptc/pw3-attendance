<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>악보 분리 · PW3 예배팀</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PW3">
<meta name="theme-color" content="#f2f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101014" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<link rel="stylesheet" href="assets/site.css?v=20260916b">
</head>
<body>
<div id="app">
  <header class="top">
    <h1>
      <a href="index.html" class="wm" style="text-decoration:none"><span class="lp">P</span><span class="lw">W</span><span class="l3">3</span><span class="spark">✦</span></a>
      악보 분리
    </h1>
    <span id="saveStatus">불러오는 중…</span>
  </header>
  <p class="subtitle">콘티 악보 PDF를 곡마다 잘라 자료실에 아카이빙합니다</p>
  <div id="nav"></div>

  <section class="card">
    <h2>1. 악보 PDF 선택</h2>
    <div id="pick"></div>
  </section>

  <section class="card" id="step2" style="display:none">
    <h2>2. 곡 경계 지정 <span class="sub">곡이 시작되는 페이지를 체크하고 곡명을 입력</span></h2>
    <div id="contiInfo"></div>
    <datalist id="contiList"></datalist>
    <div id="pages" class="pages"></div>
    <div class="plan" id="plan"></div>
    <div class="row" style="margin-top:14px">
      <input type="date" id="fromDate" style="max-width:180px">
      <span class="uphint" style="margin:0">어느 콘티의 악보인지 (선택)</span>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="primary" id="go">나누어 업로드</button>
      <button class="ghost" id="reset">처음부터</button>
    </div>
    <div class="uphint" id="prog"></div>
  </section>

  <section class="card" id="done" style="display:none">
    <h2>완료</h2>
    <div id="result" class="list"></div>
    <div class="filebtns"><a class="filebtn" href="resources.html">자료실에서 보기</a></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="assets/site.js?v=20261011a"></script>
<script>
(function(){
"use strict";
var $ = function(s){ return document.querySelector(s); };
var esc = PW3.esc;
var MAX_PAGES = 60;
var state = PW3.normalize(null);
var unlocked = PW3.hasPin();
var srcBytes = null;      /* 원본 PDF 바이트 */
var pageCount = 0;
var marks = [];           /* [{start:bool, title:string, manual:bool}] */
var contiSongs = [];      /* 불러온 콘티의 곡 제목 (순서대로). 시작 페이지를 체크하면 차례로 채워진다 */
var contiDate = '';
var contiId = '';

$('#nav').innerHTML = PW3.navHTML('setlist');
function setStatus(t, cls){ var el=$('#saveStatus'); el.textContent=t; el.className=cls||''; }
function prog(t, cls){ var el=$('#prog'); el.textContent=t; el.className='uphint'+(cls?' '+cls:''); }

if(window.pdfjsLib){
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
}

/* ---------- 1. 파일 선택 ---------- */
function renderPick(){
  var box = $('#pick');
  if(!unlocked){
    box.innerHTML = '<button id="unlock">시작하기 (PIN)</button>';
    $('#unlock').addEventListener('click', function(){
      /* PIN 통과 후에는 데이터를 다시 받아야 한다 */
      PW3.inlinePin(box, function(){ location.reload(); }, function(){ renderPick(); });
    });
    return;
  }
  box.innerHTML =
    contiListHTML()+
    '<div class="row">'+
      '<label class="filepick" for="f">악보 PDF 직접 선택</label>'+
      '<input type="file" id="f" accept="application/pdf" style="display:none">'+
    '</div>'+
    '<div class="uphint" id="pickHint">한 PDF 안에 여러 곡이 들어 있는 콘티 악보를 넣으세요. 20MB까지.</div>';
  Array.prototype.forEach.call(box.querySelectorAll('[data-conti]'), function(b){
    b.addEventListener('click', function(){ pickConti(b.dataset.conti); });
  });
  $('#f').addEventListener('change', function(){
    var file = this.files && this.files[0];
    if(!file) return;
    if(file.size > 20*1024*1024){
      hint('파일이 20MB를 넘습니다.', 'err');
      return;
    }
    hint(file.name + ' — 페이지를 그리는 중…');
    var fr = new FileReader();
    fr.onload = function(){ loadPdf(new Uint8Array(fr.result), file.name); };
    fr.onerror = function(){ hint('파일을 읽지 못했습니다.', 'err'); };
    fr.readAsArrayBuffer(file);
  });
}
function hint(t, cls){ var el=$('#pickHint'); if(!el) return; el.textContent=t; el.className='uphint'+(cls?' '+cls:''); }

/* 최근 콘티 목록. 악보 링크가 있는 콘티는 바로 불러오고,
   링크가 없는 콘티는 곡 제목·날짜만 가져온 뒤 파일을 직접 고르게 한다 */
var CONTI_MAX = 8;
function recentSetlists(){
  return state.setlists.slice()
    .sort(function(a,b){ return a.date < b.date ? 1 : -1; })
    .slice(0, CONTI_MAX);
}
function contiListHTML(){
  var ls = recentSetlists();
  if(!ls.length) return '';
  return '<div class="uphint" style="margin:0 0 8px">콘티에서 불러오기 — 악보와 곡 제목을 한 번에 가져옵니다</div>'+
    '<div class="list" style="margin-bottom:14px">'+
    ls.map(function(sl){
      var titles = (sl.songs||[]).map(function(x){ return x.title; }).join(' · ');
      var has = !!PW3.driveFileId(sl.scoreUrl);
      return '<div class="item"><div>'+
          '<div class="t">'+esc(PW3.dateLabel(sl.date))+' 콘티</div>'+
          '<div class="m">'+esc(titles || '곡 없음')+(has ? '' : (sl.scoreUrl ? ' · 외부 링크(직접 선택 필요)' : ' · 악보 없음(직접 선택 필요)'))+'</div>'+
        '</div>'+
        '<button data-conti="'+esc(sl.id)+'">'+(has ? '불러오기' : '곡 제목만')+'</button>'+
      '</div>';
    }).join('')+'</div>';
}
function findSetlist(id){
  for(var i=0;i<state.setlists.length;i++) if(state.setlists[i].id===id) return state.setlists[i];
  return null;
}
function pickConti(id){
  var sl = findSetlist(id);
  if(!sl) return;
  contiId = sl.id;
  contiDate = sl.date;
  contiSongs = (sl.songs||[]).map(function(x){ return String(x.title||'').trim(); }).filter(Boolean);
  var fid = PW3.driveFileId(sl.scoreUrl);
  if(!fid){
    hint(PW3.dateLabel(sl.date)+' 콘티의 곡 '+contiSongs.length+'개를 가져왔습니다. 악보 PDF를 직접 선택해 주세요.', 'ok');
    return;
  }
  Array.prototype.forEach.call(document.querySelectorAll('[data-conti]'), function(b){ b.disabled = true; });
  hint(PW3.dateLabel(sl.date)+' 콘티 악보를 받는 중…');
  PW3.downloadFile(fid, function(err, res){
    Array.prototype.forEach.call(document.querySelectorAll('[data-conti]'), function(b){ b.disabled = false; });
    if(err){
      hint(PW3.downloadError(err) + ' — 곡 제목 '+contiSongs.length+'개는 가져왔습니다.', 'err');
      return;
    }
    hint(res.name + ' — 페이지를 그리는 중…');
    loadPdf(res.bytes, res.name);
  }, function(done, total){
    if(total > 1) hint(PW3.dateLabel(sl.date)+' 콘티 악보를 받는 중… ('+done+'/'+total+')');
  });
}

/* ---------- 2. 페이지 렌더 ---------- */
function loadPdf(bytes, name){
  srcBytes = bytes;
  pdfjsLib.getDocument({data: bytes.slice()}).promise.then(function(pdf){
    pageCount = Math.min(pdf.numPages, MAX_PAGES);
    marks = [];
    for(var i=0;i<pageCount;i++) marks.push({start: i===0, title: '', manual: false});
    if(!contiSongs.length) marks[0] = {start:true, title: stripExt(name), manual: true};
    autoTitles();
    $('#pages').innerHTML = '';
    $('#step2').style.display = '';
    renderContiInfo();
    if(contiDate) $('#fromDate').value = contiDate;
    hint(name + ' — 총 ' + pdf.numPages + '페이지' +
      (pdf.numPages > MAX_PAGES ? ' (앞 ' + MAX_PAGES + '페이지만 표시)' : ''));
    var chain = Promise.resolve();
    for(var p=1;p<=pageCount;p++) chain = chain.then(makeRenderer(pdf, p));
    chain.then(function(){ renderPlan(); });
  }).catch(function(){
    hint('PDF를 여는 데 실패했습니다.', 'err');
  });
}
/* 콘티 곡 목록을 2단계 위에 보여 주고, 곡명 입력칸의 자동완성 목록으로도 넣는다 */
function renderContiInfo(){
  var box = $('#contiInfo');
  if(!contiSongs.length){ box.innerHTML = ''; $('#contiList').innerHTML = ''; return; }
  box.innerHTML = '<div class="uphint" style="margin:0">'+
    esc(PW3.dateLabel(contiDate))+' 콘티 곡 순서: '+
    contiSongs.map(function(t, i){ return (i+1)+'. '+esc(t); }).join(' · ')+
    '<br>시작 페이지를 체크하면 이 순서대로 곡명이 채워집니다. 다르면 고쳐 쓰세요.</div>';
  $('#contiList').innerHTML = contiSongs.map(function(t){ return '<option value="'+esc(t)+'">'; }).join('');
}
/* 체크된 시작 페이지에 콘티 곡 제목을 순서대로 넣는다. 손으로 고친 칸은 건드리지 않는다 */
function autoTitles(){
  if(!contiSongs.length) return;
  var k = 0;
  for(var i=0;i<pageCount;i++){
    if(!marks[i].start) continue;
    if(!marks[i].manual) marks[i].title = contiSongs[k] || '';
    k++;
    var ti = document.querySelector('[data-ti="'+(i+1)+'"]');
    if(ti && !marks[i].manual) ti.value = marks[i].title;
  }
}
function stripExt(n){ return String(n||'').replace(/\.pdf$/i, ''); }
function makeRenderer(pdf, num){
  return function(){
    return pdf.getPage(num).then(function(page){
      var vp = page.getViewport({scale: 1});
      var scale = 260 / vp.width;
      var v = page.getViewport({scale: scale});
      var canvas = document.createElement('canvas');
      canvas.width = Math.floor(v.width); canvas.height = Math.floor(v.height);
      var div = document.createElement('div');
      div.className = 'page' + (marks[num-1].start ? ' start' : '');
      div.id = 'pg' + num;
      div.appendChild(canvas);
      var meta = document.createElement('div');
      meta.innerHTML =
        '<div class="pno">'+num+'페이지</div>'+
        '<label class="ck"><input type="checkbox" data-st="'+num+'"'+(marks[num-1].start?' checked':'')+
          (num===1?' disabled':'')+'> 여기서 새 곡 시작</label>'+
        '<input type="text" data-ti="'+num+'" list="contiList" placeholder="곡 제목" value="'+esc(marks[num-1].title)+'"'+
          (marks[num-1].start?'':' style="display:none"')+'>';
      div.appendChild(meta);
      $('#pages').appendChild(div);
      bind(num);
      return page.render({canvasContext: canvas.getContext('2d'), viewport: v}).promise;
    });
  };
}
function bind(num){
  var ck = document.querySelector('[data-st="'+num+'"]');
  var ti = document.querySelector('[data-ti="'+num+'"]');
  ck.addEventListener('change', function(){
    marks[num-1].start = ck.checked;
    if(!ck.checked){ marks[num-1].manual = false; marks[num-1].title = ''; ti.value = ''; }
    ti.style.display = ck.checked ? '' : 'none';
    $('#pg'+num).className = 'page' + (ck.checked ? ' start' : '');
    autoTitles();
    if(ck.checked && !ti.value) ti.focus();
    renderPlan();
  });
  ti.addEventListener('input', function(){
    marks[num-1].title = ti.value;
    marks[num-1].manual = ti.value.trim() !== '';   /* 비우면 다시 자동 채움 대상 */
    autoTitles();
    renderPlan();
  });
}

/* ---------- 구간 계산 ---------- */
function segments(){
  var segs = [], cur = null;
  for(var i=0;i<pageCount;i++){
    if(marks[i].start){
      if(cur) segs.push(cur);
      cur = { title: (marks[i].title||'').trim(), from: i+1, to: i+1 };
    } else if(cur){ cur.to = i+1; }
  }
  if(cur) segs.push(cur);
  return segs;
}
function renderPlan(){
  var segs = segments();
  $('#plan').textContent = segs.length
    ? segs.map(function(s, i){
        return (i+1)+'. '+(s.title || '(곡명 미입력)')+' — '+
               (s.from === s.to ? s.from+'페이지' : s.from+'–'+s.to+'페이지');
      }).join('\n')
    : '곡 시작 페이지를 체크해 주세요.';
}

/* ---------- 3. 분리 + 업로드 ---------- */
$('#go').addEventListener('click', function(){
  var segs = segments();
  if(!segs.length){ prog('곡 시작 페이지를 체크해 주세요.','err'); return; }
  var missing = segs.filter(function(s){ return !s.title; });
  if(missing.length){ prog('곡명을 입력하지 않은 구간이 '+missing.length+'개 있습니다.','err'); return; }
  $('#go').disabled = true;
  runSplit(segs);
});
$('#reset').addEventListener('click', function(){ location.reload(); });

function runSplit(segs){
  var made = [];
  var fromDate = $('#fromDate').value || contiDate;
  PDFLib.PDFDocument.load(srcBytes).then(function(src){
    var chain = Promise.resolve();
    segs.forEach(function(seg, idx){
      chain = chain.then(function(){
        prog('('+(idx+1)+'/'+segs.length+') '+seg.title+' 처리 중…');
        return PDFLib.PDFDocument.create().then(function(out){
          var idxs = [];
          for(var p=seg.from; p<=seg.to; p++) idxs.push(p-1);
          return out.copyPages(src, idxs).then(function(pages){
            pages.forEach(function(pg){ out.addPage(pg); });
            return out.save();
          });
        }).then(function(bytes){
          return new Promise(function(resolve){
            PW3.uploadFile({name: seg.title + '.pdf', bytes: bytes}, '곡별 악보', function(err, res){
              if(err){ made.push({title: seg.title, error: PW3.uploadError(err)}); }
              else { made.push({title: seg.title, url: res.url, name: res.name, pages: seg.from+'–'+seg.to}); }
              resolve();
            });
          });
        });
      });
    });
    return chain;
  }).then(function(){
    var ok = made.filter(function(m){ return m.url; });
    ok.forEach(function(m){
      state.resources.push({
        id: PW3.uid(), cat: '곡별 악보', title: m.title, url: m.url,
        memo: (fromDate ? PW3.dateLabel(fromDate)+' 콘티' : '') , at: Date.now()
      });
    });
    if(!ok.length){ prog('업로드된 파일이 없습니다.','err'); $('#go').disabled = false; return; }
    prog('자료실에 등록하는 중…');
    PW3.saveSection({resources: state.resources}, function(err){
      $('#go').disabled = false;
      if(err){ prog('자료실 등록 실패 — 파일은 드라이브에 올라갔습니다.','err'); setStatus('저장 실패','err'); return; }
      prog('');
      setStatus('저장됨');
      $('#done').style.display = '';
      $('#result').innerHTML = made.map(function(m){
        return '<div class="item"><div>'+
          '<div class="t">'+esc(m.title)+'</div>'+
          '<div class="m">'+(m.url
            ? '<a href="'+esc(m.url)+'" target="_blank" rel="noopener noreferrer">링크 열기</a> · '+esc(m.pages)+'페이지'
            : '<span style="color:var(--bad);font-weight:700">'+esc(m.error)+'</span>')+
          '</div></div></div>';
      }).join('');
      $('#done').scrollIntoView({behavior:'smooth'});
    });
  }).catch(function(){
    $('#go').disabled = false;
    prog('PDF를 나누는 중 오류가 났습니다.','err');
  });
}

PW3.load(function(err, s){
  state = s;
  setStatus(err ? '오프라인' : '저장됨', err ? 'err' : '');
  renderPick();
});
})();
</script>
</body>
</html>
