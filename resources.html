<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>자료실 · PW3 예배팀</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💙</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<div id="app">
  <header class="top">
    <h1>
      <a href="index.html" class="wm"><span class="lp">P</span><span class="lw">W</span><span class="l3">3</span><span class="spark">✦</span></a>
      자료실
    </h1>
    <span id="saveStatus">불러오는 중…</span>
  </header>
  <p class="subtitle">콘티·악보·링크 모음 · 파일은 구글드라이브 링크로 등록</p>
  <div id="nav"></div>

  <section class="card">
    <h2>자료 등록 <span class="sub">등록·삭제는 리더십 PIN</span></h2>
    <div id="resAdd"></div>
  </section>

  <div id="resList"><div class="card"><div class="empty">불러오는 중…</div></div></div>
</div>

<script src="assets/site.js"></script>
<script>
(function(){
"use strict";
var $ = function(s){ return document.querySelector(s); };
var esc = PW3.esc;
var CATS = ['콘티','악보','음원','기타'];
var state = PW3.normalize(null);
var unlocked = PW3.pinOK();

$('#nav').innerHTML = PW3.navHTML('resources');
function setStatus(t, cls){ var el=$('#saveStatus'); el.textContent=t; el.className=cls||''; }
function save(){
  setStatus('저장 중…','busy');
  PW3.saveSection({resources:state.resources}, function(err){
    setStatus(err ? '저장 실패' : '저장됨', err ? 'err' : '');
  });
}
function safeURL(u){
  u = String(u||'').trim();
  if(!u) return '';
  if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
  return /^https?:\/\//i.test(u) ? u : '';
}

function renderAdd(){
  var box = $('#resAdd');
  if(!unlocked){
    box.innerHTML = '<button id="unlock">자료 등록하기 (PIN)</button>';
    $('#unlock').addEventListener('click', function(){
      var pin = prompt('리더십 PIN을 입력해 주세요.');
      if(pin === null) return;
      if(!PW3.pinCheck(pin)){ setStatus('PIN 불일치','err'); return; }
      PW3.pinSet(); unlocked = true; renderAdd(); renderList();
    });
    return;
  }
  box.innerHTML =
    '<div class="row">'+
      '<select id="rCat" style="max-width:120px">'+CATS.map(function(c){ return '<option>'+c+'</option>'; }).join('')+'</select>'+
      '<input type="text" id="rTitle" class="grow" placeholder="자료명">'+
    '</div>'+
    '<div class="row" style="margin-top:8px">'+
      '<input type="url" id="rUrl" class="grow" placeholder="링크 (구글드라이브·유튜브 등)">'+
      '<input type="text" id="rMemo" class="grow" placeholder="메모 (선택)">'+
      '<button class="primary" id="rGo">등록</button>'+
    '</div>';
  $('#rGo').addEventListener('click', function(){
    var t = $('#rTitle').value.trim(), u = safeURL($('#rUrl').value);
    if(!t || !u){ setStatus('자료명·링크 확인','err'); return; }
    state.resources.push({
      id: PW3.uid(), cat:$('#rCat').value, title:t, url:u,
      memo:$('#rMemo').value.trim(), at:Date.now()
    });
    $('#rTitle').value=''; $('#rUrl').value=''; $('#rMemo').value='';
    renderList(); save();
  });
}

var pendingDel = null, delTimer = null;
function renderList(){
  var wrap = $('#resList');
  if(!state.resources.length){
    wrap.innerHTML = '<div class="card"><div class="empty">등록된 자료가 없습니다.</div></div>';
    return;
  }
  var html = '';
  CATS.forEach(function(cat){
    var items = state.resources.filter(function(r){ return (r.cat||'기타') === cat; })
                               .sort(function(a,b){ return (b.at||0) - (a.at||0); });
    if(!items.length) return;
    html += '<section class="card"><h2>'+esc(cat)+' <span class="sub">'+items.length+'건</span></h2><div class="list">';
    html += items.map(function(r){
      return '<div class="item"><div>'+
          '<div class="t">'+esc(r.title)+'</div>'+
          '<div class="m"><a href="'+esc(r.url)+'" target="_blank" rel="noopener noreferrer">링크 열기</a>'+
            (r.memo ? ' · '+esc(r.memo) : '')+'</div>'+
        '</div>'+
        (unlocked ? '<button class="danger" data-del="'+r.id+'">'+(pendingDel===r.id?'한 번 더':'삭제')+'</button>' : '')+
      '</div>';
    }).join('');
    html += '</div></section>';
  });
  wrap.innerHTML = html;
  Array.prototype.forEach.call(wrap.querySelectorAll('[data-del]'), function(b){
    b.addEventListener('click', function(){
      var id = b.dataset.del;
      if(pendingDel === id){
        clearTimeout(delTimer); pendingDel = null;
        state.resources = state.resources.filter(function(x){ return x.id !== id; });
        renderList(); save();
      } else {
        pendingDel = id; renderList();
        clearTimeout(delTimer);
        delTimer = setTimeout(function(){ pendingDel = null; renderList(); }, 4000);
      }
    });
  });
}

PW3.load(function(err, s){
  state = s;
  setStatus(err ? '오프라인' : '저장됨', err ? 'err' : '');
  renderAdd(); renderList();
});
})();
</script>
</body>
</html>
