<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>자료실 · PW3 예배팀</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💙</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<link rel="stylesheet" href="assets/site.css?v=20260902g">
</head>
<body>
<div id="app">
  <header class="top">
    <h1>
      <a href="index.html" class="wm" style="text-decoration:none"><span class="lp">P</span><span class="lw">W</span><span class="l3">3</span><span class="spark">✦</span></a>
      자료실
    </h1>
    <span id="saveStatus">불러오는 중…</span>
  </header>
  <p class="subtitle">콘티 악보·큐시트는 콘티 등록 시, 곡별 악보는 분리 도구에서 자동으로 모입니다</p>
  <div id="nav"></div>

  <section class="card">
    <div class="row">
      <input type="text" id="q" class="grow" placeholder="곡명·자료명 검색">
    </div>
  </section>

  <div id="out"><div class="card"><div class="empty">불러오는 중…</div></div></div>

  <section class="card">
    <h2>자료 등록 <span class="sub">등록·삭제는 리더십 PIN</span></h2>
    <div id="resAdd"></div>
  </section>
</div>

<script src="assets/site.js?v=20260902g"></script>
<script>
(function(){
"use strict";
var $ = function(s){ return document.querySelector(s); };
var esc = PW3.esc;
var MAIN_CAT = '곡별 악보';
var state = PW3.normalize(null);
var unlocked = PW3.hasPin();
var query = '';

$('#nav').innerHTML = PW3.navHTML('resources');
function setStatus(t, cls){ var el=$('#saveStatus'); el.textContent=t; el.className=cls||''; }
function save(){
  setStatus('저장 중…','busy');
  PW3.saveSection({resources:state.resources}, function(err){
    setStatus(err ? '저장 실패' : '저장됨', err ? 'err' : '');
  });
}
function hit(text){ return !query || String(text||'').toLowerCase().indexOf(query) >= 0; }

/* ---------- 등록 ---------- */
function renderAdd(){
  var box = $('#resAdd');
  if(!unlocked){
    box.innerHTML = '<button id="unlock">자료 등록하기 (PIN)</button>';
    $('#unlock').addEventListener('click', function(){
      PW3.inlinePin(box, function(){ unlocked = true; renderAdd(); renderAll(); },
                         function(){ renderAdd(); });
    });
    return;
  }
  box.innerHTML =
    '<div class="row">'+
      '<input type="text" id="rTitle" class="grow" placeholder="곡명">'+
    '</div>'+
    '<div class="row" style="margin-top:8px">'+
      '<input type="url" id="rUrl" class="grow" placeholder="링크 (구글드라이브·유튜브 등)">'+
      '<input type="text" id="rMemo" class="grow" placeholder="메모 (선택)">'+
      '<button class="primary" id="rGo">등록</button>'+
    '</div>';
  $('#rGo').addEventListener('click', function(){
    var t = $('#rTitle').value.trim(), u = PW3.safeURL($('#rUrl').value);
    if(!t || !u){ setStatus('자료명·링크 확인','err'); return; }
    state.resources.push({
      id: PW3.uid(), cat:MAIN_CAT, title:t, url:u,
      memo:$('#rMemo').value.trim(), at:Date.now()
    });
    $('#rTitle').value=''; $('#rUrl').value=''; $('#rMemo').value='';
    renderAll(); save();
  });
}

/* ---------- 목록 ---------- */
var pendingDel = null, delTimer = null;

function itemHTML(title, url, meta, delId){
  return '<div class="item"><div>'+
      '<div class="t">'+esc(title)+'</div>'+
      '<div class="m"><a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">링크 열기</a>'+
        (meta ? ' · '+esc(meta) : '')+'</div>'+
    '</div>'+
    (delId && unlocked ? '<button class="danger" data-del="'+delId+'">'+(pendingDel===delId?'한 번 더':'삭제')+'</button>' : '')+
  '</div>';
}
function section(title, count, inner, note){
  return '<section class="card"><h2>'+esc(title)+' <span class="sub">'+count+'건</span></h2>'+
         (note ? '<div class="empty" style="padding:0 2px 10px">'+esc(note)+'</div>' : '')+
         '<div class="list">'+inner+'</div></section>';
}

function renderAll(){
  var html = '';
  var sets = state.setlists.slice().sort(function(a,b){ return a.date < b.date ? 1 : -1; });

  /* 1. 콘티 악보 — 콘티에서 자동 수집 */
  var scores = sets.filter(function(s){ return s.scoreUrl && hit(PW3.dateLabel(s.date)+' '+(s.songs||[]).map(function(x){return x.title;}).join(' ')); });
  html += section('콘티 악보', scores.length,
    scores.length ? scores.map(function(s){
      return itemHTML(PW3.dateLabel(s.date)+' 콘티 악보', s.scoreUrl,
        (s.songs||[]).map(function(x){ return x.title; }).join(' · '), null);
    }).join('') : '<div class="empty">등록된 악보가 없습니다.</div>',
    '콘티 페이지에서 등록하면 여기에 모입니다.');

  /* 2. 큐시트 */
  var cues = sets.filter(function(s){ return s.cueUrl && hit(PW3.dateLabel(s.date)); });
  html += section('큐시트', cues.length,
    cues.length ? cues.map(function(s){
      return itemHTML(PW3.dateLabel(s.date)+' 큐시트', s.cueUrl, '', null);
    }).join('') : '<div class="empty">등록된 큐시트가 없습니다.</div>');

  /* 3. 곡별 악보 */
  var songs = state.resources
    .filter(function(r){ return (r.cat||MAIN_CAT) === MAIN_CAT && hit(r.title + ' ' + (r.memo||'')); })
    .sort(function(a,b){ return (b.at||0) - (a.at||0); });
  html += section(MAIN_CAT, songs.length,
    songs.length ? songs.map(function(r){ return itemHTML(r.title, r.url, r.memo, r.id); }).join('')
                 : '<div class="empty">'+(query ? '검색 결과가 없습니다.' : '등록된 자료가 없습니다.')+'</div>',
    '악보 분리 도구로 나눈 악보가 여기에 쌓입니다.');

  /* 4. 예전에 다른 분류로 등록된 자료가 남아 있으면 그것만 따로 */
  var others = state.resources
    .filter(function(r){ return (r.cat||MAIN_CAT) !== MAIN_CAT && hit(r.title + ' ' + (r.memo||'')); })
    .sort(function(a,b){ return (b.at||0) - (a.at||0); });
  if(others.length){
    html += section('그 밖의 자료', others.length,
      others.map(function(r){ return itemHTML(r.title + ' (' + (r.cat||'') + ')', r.url, r.memo, r.id); }).join(''));
  }

  $('#out').innerHTML = html;
  Array.prototype.forEach.call($('#out').querySelectorAll('[data-del]'), function(b){
    b.addEventListener('click', function(){
      var id = b.dataset.del;
      if(pendingDel === id){
        clearTimeout(delTimer); pendingDel = null;
        state.resources = state.resources.filter(function(x){ return x.id !== id; });
        renderAll(); save();
      } else {
        pendingDel = id; renderAll();
        clearTimeout(delTimer);
        delTimer = setTimeout(function(){ pendingDel = null; renderAll(); }, 4000);
      }
    });
  });
}

$('#q').addEventListener('input', function(){ query = this.value.trim().toLowerCase(); renderAll(); });

PW3.load(function(err, s){
  state = s;
  setStatus(err ? '오프라인' : '저장됨', err ? 'err' : '');
  renderAdd(); renderAll();
});
})();
</script>
</body>
</html>
