<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>PW3 예배팀</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💙</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<div id="app">
  <header class="top">
    <h1>
      <span class="wm"><span class="lp">P</span><span class="lw">W</span><span class="l3">3</span><span class="spark">✦</span></span>
      예배팀
    </h1>
    <span id="saveStatus">불러오는 중…</span>
  </header>
  <p class="subtitle">서파3부 예배팀 · 격주 토요일 11:00–13:00</p>
  <div id="nav"></div>

  <section class="card" id="nextCard">
    <h2>다음 토요모임</h2>
    <div class="empty">불러오는 중…</div>
  </section>

  <section class="card">
    <h2>공지 <span class="sub">수정은 리더십 PIN</span></h2>
    <div id="noticeView"><div class="empty">불러오는 중…</div></div>
    <div class="row" style="margin-top:12px">
      <button id="noticeEdit">공지 수정</button>
    </div>
  </section>

  <div class="menugrid">
    <a href="schedule.html"><div class="t">일정</div><div class="d">모임·행사 일정 보기</div></a>
    <a href="attendance.html"><div class="t">출결부</div><div class="d">토요모임 출결 체크</div></a>
    <a href="resources.html"><div class="t">자료실</div><div class="d">콘티·악보·링크 모음</div></a>
  </div>
</div>

<script src="assets/site.js"></script>
<script>
(function(){
"use strict";
var $ = function(s){ return document.querySelector(s); };
var esc = PW3.esc;
var state = PW3.normalize(null);
var editing = false;

$('#nav').innerHTML = PW3.navHTML('home');

function setStatus(t, cls){ var el=$('#saveStatus'); el.textContent=t; el.className=cls||''; }

function renderNext(){
  var today = PW3.todayISO();
  var up = state.meetings.filter(function(m){ return m.date >= today; })
                         .sort(function(a,b){ return a.date < b.date ? -1 : 1; });
  var c = $('#nextCard');
  if(!up.length){
    c.innerHTML = '<h2>다음 토요모임</h2><div class="empty">예정된 모임이 없습니다. 출결부에서 날짜를 추가해 주세요.</div>';
    return;
  }
  var m = up[0];
  var d = PW3.daysUntil(m.date);
  var dd = d === 0 ? 'D-DAY' : 'D-' + d;
  c.innerHTML =
    '<h2>다음 토요모임</h2>'+
    '<div class="dday">'+
      '<span class="big">'+dd+'</span>'+
      '<span class="when">'+esc(PW3.dateLabel(m.date))+' 11:00–13:00</span>'+
    '</div>'+
    (up.length>1 ? '<div class="m" style="margin-top:10px;font-size:.82rem;color:var(--muted)">그다음 '+esc(PW3.dateLabel(up[1].date))+'</div>' : '');
}

function renderNotice(){
  var v = $('#noticeView');
  if(editing){
    v.innerHTML = '<textarea id="noticeText">'+esc(state.notice.text)+'</textarea>';
    $('#noticeEdit').textContent = '저장';
    if(!$('#noticeCancel')){
      var b = document.createElement('button');
      b.id = 'noticeCancel'; b.className = 'ghost'; b.textContent = '취소';
      $('#noticeEdit').parentNode.appendChild(b);
      b.addEventListener('click', function(){ editing=false; renderNotice(); });
    }
    $('#noticeText').focus();
    return;
  }
  var c = $('#noticeCancel'); if(c) c.parentNode.removeChild(c);
  $('#noticeEdit').textContent = '공지 수정';
  v.innerHTML = state.notice.text
    ? '<div class="notice">'+esc(state.notice.text)+'</div>'+
      (state.notice.at ? '<div class="m" style="margin-top:10px;font-size:.78rem;color:var(--muted)">최종 수정 '+esc(PW3.dateLabel(new Date(state.notice.at).toISOString().slice(0,10)))+'</div>' : '')
    : '<div class="empty">등록된 공지가 없습니다.</div>';
}

$('#noticeEdit').addEventListener('click', function(){
  if(editing){
    var txt = $('#noticeText').value;
    state.notice = {text:txt, at:Date.now()};
    editing = false; renderNotice();
    setStatus('저장 중…','busy');
    PW3.saveSection({notice:state.notice}, function(err){
      setStatus(err ? '저장 실패' : '저장됨', err ? 'err' : '');
    });
    return;
  }
  if(!PW3.pinOK()){
    var pin = prompt('리더십 PIN을 입력해 주세요.');
    if(pin === null) return;
    if(!PW3.pinCheck(pin)){ setStatus('PIN 불일치','err'); return; }
    PW3.pinSet();
  }
  editing = true; renderNotice();
});

PW3.load(function(err, s){
  state = s;
  setStatus(err ? '오프라인' : '저장됨', err ? 'err' : '');
  renderNext(); renderNotice();
});
})();
</script>
</body>
</html>
