<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>PW3 예배팀</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💙</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<link rel="stylesheet" href="assets/site.css?v=20260902g">
</head>
<body>
<div id="app">
  <header class="top">
    <h1>
      <span class="wm"><span class="lp">P</span><span class="lw">W</span><span class="l3">3</span><span class="spark">✦</span></span>
      예배팀
    </h1>
    <span id="saveStatus">불러오는 중…</span>
  </header>
  <p class="subtitle">서파3부 예배팀 · 격주 토요일 11:00–13:00</p>
  <div id="nav"></div>

  <section class="card" id="nextCard">
    <h2>다음 토요모임</h2>
    <div class="empty">불러오는 중…</div>
  </section>

  <section class="card" id="setCard">
    <h2>금주 콘티</h2>
    <div class="empty">불러오는 중…</div>
  </section>

  <section class="card" id="serveCard">
    <h2>금주 섬김</h2>
    <div class="empty">불러오는 중…</div>
  </section>

  <section class="card">
    <h2>공지 <span class="sub">수정은 리더십 PIN</span></h2>
    <div id="noticeView"><div class="empty">불러오는 중…</div></div>
    <div class="row" id="noticeCtl" style="margin-top:12px"></div>
  </section>

  </div>
</div>

<script src="assets/site.js?v=20260902g"></script>
<script>
(function(){
"use strict";
var $ = function(s){ return document.querySelector(s); };
var esc = PW3.esc;
var state = PW3.normalize(null);
var editing = false;

$('#nav').innerHTML = PW3.navHTML('home');

function setStatus(t, cls){ var el=$('#saveStatus'); el.textContent=t; el.className=cls||''; }

function renderNext(){
  var today = PW3.todayISO();
  var up = state.meetings.filter(function(m){ return m.date >= today; })
                         .sort(function(a,b){ return a.date < b.date ? -1 : 1; });
  var c = $('#nextCard');
  if(!up.length){
    c.innerHTML = '<h2>다음 토요모임</h2><div class="empty">예정된 모임이 없습니다. 출결부에서 날짜를 추가해 주세요.</div>';
    return;
  }
  var m = up[0];
  var d = PW3.daysUntil(m.date);
  var dd = d === 0 ? 'D-DAY' : 'D-' + d;
  c.innerHTML =
    '<h2>다음 토요모임</h2>'+
    '<div class="dday">'+
      '<span class="big">'+dd+'</span>'+
      '<span class="when">'+esc(PW3.dateLabel(m.date))+' 11:00–13:00</span>'+
    '</div>'+
    (up.length>1 ? '<div class="m" style="margin-top:10px;font-size:.82rem;color:var(--muted)">그다음 '+esc(PW3.dateLabel(up[1].date))+'</div>' : '');
}

function renderCtl(){
  var c = $('#noticeCtl');
  c.innerHTML = editing
    ? '<button class="primary" id="noticeSave">저장</button><button class="ghost" id="noticeCancel">취소</button>'
    : '<button id="noticeEdit">공지 수정</button>';
  if(editing){
    $('#noticeSave').addEventListener('click', doSave);
    $('#noticeCancel').addEventListener('click', function(){ editing=false; renderNotice(); renderCtl(); });
  } else {
    $('#noticeEdit').addEventListener('click', startEdit);
  }
}

/* PIN이 없으면 서버가 링크를 지우고 hasScore/hasCue 플래그만 준다 */
function fileBtn(url, has, label, short){
  if(url) return '<a class="filebtn" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+label+'</a>';
  if(has) return '<span class="filebtn off">🔒 '+short+' (PIN 필요)</span>';
  return '';
}
function renderSetlist(){
  var c = $('#setCard');
  var sl = PW3.currentByDate(state.setlists);
  if(!sl){
    c.innerHTML = '<h2>금주 콘티</h2><div class="empty">등록된 콘티가 없습니다. '+
                  '<a href="setlist.html" style="color:var(--accent);font-weight:700">콘티 등록하기</a></div>';
    return;
  }
  var songs = (sl.songs || []).map(function(sg, i){
    return '<li><span class="no">'+(i+1)+'</span>'+
             '<span class="ti">'+esc(sg.title)+'</span>'+
             (sg.url ? '<a class="yt" href="'+esc(sg.url)+'" target="_blank" rel="noopener noreferrer">▶ 유튜브</a>' : '')+
           '</li>';
  }).join('');
  var files = fileBtn(sl.scoreUrl, sl.hasScore, '콘티 악보 PDF', '악보') +
              fileBtn(sl.cueUrl, sl.hasCue, '큐시트 PDF', '큐시트') +
              '<a class="filebtn off" href="setlist.html">지난 콘티 보기</a>';
  c.innerHTML = '<h2>금주 콘티 <span class="sub">'+esc(PW3.dateLabel(sl.date))+'</span></h2>'+
                '<ul class="songs">'+songs+'</ul>'+
                '<div class="filebtns">'+files+'</div>';
}

function renderServe(){
  var c = $('#serveCard');
  var near = PW3.currentByDate(state.serves);
  if(!near){
    c.innerHTML = '<h2>금주 섬김</h2><div class="empty">등록된 섬김표가 없습니다. '+
                  '<a href="serve.html" style="color:var(--accent);font-weight:700">섬김표 작성하기</a></div>';
    return;
  }
  var date = near.date;
  var blocks = PW3.SERVE_TEAMS.map(function(t){
    var sv = PW3.findServe(state.serves, t.key, date);
    if(!sv) return '';
    var filled = t.parts.filter(function(p){ return (sv.slots||{})[p]; });
    var line = filled.length
      ? filled.map(function(p){ return '<span class="p">'+esc(p)+'</span> '+esc(sv.slots[p]); }).join(' · ')
      : '<span class="p">미정</span>';
    return '<div><div class="tm">'+esc(t.label)+'</div><div class="ln">'+line+'</div></div>';
  }).filter(Boolean).join('');
  c.innerHTML = '<h2>금주 섬김 <span class="sub">'+esc(PW3.dateLabel(date))+'</span></h2>'+
                '<div class="homeserve">'+blocks+'</div>'+
                '<div class="filebtns"><a class="filebtn off" href="serve.html">섬김표 전체 보기</a></div>';
}

function renderNotice(){
  var v = $('#noticeView');
  if(editing){
    v.innerHTML = '<textarea id="noticeText">'+esc(state.notice.text)+'</textarea>';
    $('#noticeText').focus();
    return;
  }
  v.innerHTML = state.notice.text
    ? '<div class="notice">'+esc(state.notice.text)+'</div>'+
      (state.notice.at ? '<div style="margin-top:10px;font-size:.78rem;color:var(--muted)">최종 수정 '+esc(PW3.dateLabel(new Date(state.notice.at).toISOString().slice(0,10)))+'</div>' : '')
    : '<div class="empty">등록된 공지가 없습니다.</div>';
}

function startEdit(){
  if(!PW3.hasPin()){
    PW3.inlinePin($('#noticeCtl'),
      function(){ editing = true; renderNotice(); renderCtl(); },
      function(){ renderCtl(); });
    return;
  }
  editing = true; renderNotice(); renderCtl();
}

function doSave(){
  state.notice = {text: $('#noticeText').value, at: Date.now()};
  editing = false; renderNotice(); renderCtl();
  setStatus('저장 중…','busy');
  PW3.saveSection({notice:state.notice}, function(err){
    setStatus(err ? '저장 실패' : '저장됨', err ? 'err' : '');
  });
}

PW3.load(function(err, s){
  state = s;
  setStatus(err ? '오프라인' : '저장됨', err ? 'err' : '');
  renderNext(); renderSetlist(); renderServe(); renderNotice(); renderCtl();
});
})();
</script>
</body>
</html>
