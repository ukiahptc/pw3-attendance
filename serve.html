<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>섬김표 · PW3 예배팀</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💙</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<link rel="stylesheet" href="assets/site.css?v=20260902j">
<style>
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.serve{border-collapse:collapse;width:100%;min-width:520px}
table.serve th,table.serve td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:middle}
table.serve th{font-size:.8rem;font-weight:800;color:var(--muted);white-space:nowrap;background:var(--surface2)}
table.serve th:first-child,table.serve td:first-child{position:sticky;left:0;background:var(--surface);white-space:nowrap;font-weight:800;font-size:.88rem}
table.serve th:first-child{background:var(--surface2)}
table.serve select{width:100%;min-width:104px;font-size:.85rem;padding:7px 8px}
table.serve select.sub{margin-top:5px;font-size:.78rem;color:var(--muted)}
table.serve td.act{text-align:right;white-space:nowrap}
table.serve td.act button{font-size:.76rem;padding:6px 10px}
.mrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.mrow select{width:auto;min-width:96px}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <h1>
      <a href="index.html" class="wm" style="text-decoration:none"><span class="lp">P</span><span class="lw">W</span><span class="l3">3</span><span class="spark">✦</span></a>
      섬김표
    </h1>
    <span id="saveStatus">불러오는 중…</span>
  </header>
  <p class="subtitle">달을 고르면 그 달의 일요일이 자동으로 채워집니다</p>
  <div id="nav"></div>

  <nav class="teamtabs" id="teamtabs"></nav>

  <section class="card">
    <div class="mrow">
      <select id="yy"></select>
      <select id="mm"></select>
      <span id="title" style="font-weight:800;font-size:1.02rem"></span>
    </div>
    <div class="tblwrap"><div id="table"></div></div>
    <div class="row" style="margin-top:14px">
      <button class="primary" id="save">저장</button>
      <button id="copyM">표 복사</button>
      <button id="imgM">이미지 저장</button>
    </div>
    <div class="copied" id="note"></div>
  </section>
</div>

<script src="assets/site.js?v=20260902j"></script>
<script>
(function(){
"use strict";
var $ = function(s){ return document.querySelector(s); };
var esc = PW3.esc;
var state = PW3.normalize(null);
var unlocked = PW3.hasPin();
var team = 'singer';
var now = new Date();
var yy = now.getFullYear(), mm = now.getMonth() + 1;

$('#nav').innerHTML = PW3.navHTML('serve');
function setStatus(t, cls){ var el=$('#saveStatus'); el.textContent=t; el.className=cls||''; }
function note(t, cls){ var el=$('#note'); el.textContent=t||''; el.className='copied'+(cls?' '+cls:''); }

/* ---------- 연·월 선택 ---------- */
function fillYM(){
  var ys = '';
  for(var y=now.getFullYear()-1; y<=now.getFullYear()+1; y++)
    ys += '<option value="'+y+'"'+(y===yy?' selected':'')+'>'+y+'년</option>';
  $('#yy').innerHTML = ys;
  var ms = '';
  for(var m=1;m<=12;m++) ms += '<option value="'+m+'"'+(m===mm?' selected':'')+'>'+m+'월</option>';
  $('#mm').innerHTML = ms;
}
$('#yy').addEventListener('change', function(){ yy = +this.value; render(); });
$('#mm').addEventListener('change', function(){ mm = +this.value; render(); });

/* ---------- 팀 탭 ---------- */
function renderTabs(){
  $('#teamtabs').innerHTML = PW3.SERVE_TEAMS.map(function(t){
    return '<button data-team="'+t.key+'"'+(t.key===team?' class="on"':'')+'>'+esc(t.label)+'</button>';
  }).join('');
  Array.prototype.forEach.call($('#teamtabs').querySelectorAll('[data-team]'), function(b){
    b.addEventListener('click', function(){ team = b.dataset.team; render(); });
  });
}

/* ---------- 이름 드롭다운 ---------- */
function nameOptions(fromTeam, selected){
  var own = PW3.membersOfTeam(state.members, fromTeam);
  var ownNames = own.map(function(m){ return m.name; });
  var rest = state.members.filter(function(m){ return ownNames.indexOf(m.name) < 0; });
  var h = '<option value="">—</option>';
  if(own.length){
    h += '<optgroup label="'+esc(fromTeam)+'">' +
         own.map(function(m){ return opt(m.name, selected); }).join('') + '</optgroup>';
  }
  if(rest.length){
    h += '<optgroup label="그 외 전체">' +
         rest.map(function(m){ return opt(m.name + ' · ' + (m.team||''), selected, m.name); }).join('') + '</optgroup>';
  }
  /* 명단에 없는 이름은 객원으로 표시하고 값은 그대로 지킨다 */
  if(selected && state.members.every(function(m){ return m.name !== selected; })){
    h += '<option value="'+esc(selected)+'" selected>'+esc(selected)+' (객원)</option>';
  }
  return h;
}
function opt(label, selected, value){
  var v = value === undefined ? label : value;
  return '<option value="'+esc(v)+'"'+(v===selected?' selected':'')+'>'+esc(label)+'</option>';
}

/* ---------- 표 ---------- */
function render(){
  renderTabs(); fillYM();
  var t = PW3.serveTeam(team);
  var dates = PW3.sundaysOf(yy, mm);
  $('#title').textContent = String(yy).slice(2) + '.' + (mm<10?'0':'') + mm + ' ' + t.label + ' 섬김표';

  if(!unlocked){
    $('#table').innerHTML = '<div id="lock"></div>';
    PW3.inlinePin($('#lock'), function(){ unlocked = true; render(); }, function(){ render(); });
    return;
  }
  var h = '<table class="serve"><thead><tr><th>섬김 날짜</th>' +
          t.parts.map(function(p){ return '<th>'+esc(p.name)+'</th>'; }).join('') +
          '<th></th></tr></thead><tbody>';
  dates.forEach(function(date){
    var sv = PW3.findServe(state.serves, team, date);
    var slots = sv ? sv.slots : {};
    h += '<tr><td>'+esc(PW3.mdLabel(date))+'</td>';
    t.parts.forEach(function(p){
      var c = PW3.cell(slots, p.name);
      h += '<td><select data-d="'+date+'" data-p="'+esc(p.name)+'" data-k="m">'+nameOptions(p.from, c.m)+'</select>';
      if(t.dual){
        h += '<select class="sub" data-d="'+date+'" data-p="'+esc(p.name)+'" data-k="s">'+nameOptions(p.from, c.s)+'</select>';
      }
      h += '</td>';
    });
    h += '<td class="act"><button data-w="'+date+'">주간 복사</button></td></tr>';
  });
  h += '</tbody></table>';
  $('#table').innerHTML = h;

  Array.prototype.forEach.call($('#table').querySelectorAll('[data-w]'), function(b){
    b.addEventListener('click', function(){ copyWeek(b.dataset.w); });
  });
}

/* 화면의 표를 읽어 state.serves에 반영 */
function collect(){
  var t = PW3.serveTeam(team);
  var byDate = {};
  Array.prototype.forEach.call($('#table').querySelectorAll('select[data-d]'), function(sel){
    var d = sel.dataset.d, p = sel.dataset.p, k = sel.dataset.k, v = sel.value.trim();
    if(!byDate[d]) byDate[d] = {};
    if(!byDate[d][p]) byDate[d][p] = {m:'', s:''};
    byDate[d][p][k] = v;
  });
  Object.keys(byDate).forEach(function(d){
    var slots = {}, any = false;
    Object.keys(byDate[d]).forEach(function(p){
      var c = byDate[d][p];
      if(c.m || c.s){ slots[p] = {m:c.m, s:c.s}; any = true; }
    });
    state.serves = state.serves.filter(function(x){ return !(x.team===team && x.date===d); });
    if(any) state.serves.push({ id: PW3.uid(), team: team, date: d, slots: slots, at: Date.now() });
  });
  return t;
}
$('#save').addEventListener('click', function(){
  collect();
  setStatus('저장 중…','busy'); note('');
  PW3.saveSection({serves:state.serves}, function(err){
    setStatus(err ? '저장 실패' : '저장됨', err ? 'err' : '');
    note(err ? '저장에 실패했습니다.' : '저장했습니다.', err ? 'err' : '');
  });
});

/* ---------- 내보내기 ---------- */
function copyText(txt, msg){
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); note(msg); }
    catch(e){ note('복사 실패 — 직접 선택해 복사해 주세요.','err'); }
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ note(msg); }).catch(fallback);
  } else fallback();
}
function copyWeek(date){
  collect();
  var sv = PW3.findServe(state.serves, team, date);
  copyText(PW3.serveText(team, date, sv ? sv.slots : {}), PW3.mdLabel(date) + ' 섬김을 복사했습니다.');
}
$('#copyM').addEventListener('click', function(){
  collect();
  copyText(PW3.serveMonthText(team, yy, mm, state.serves), '이 달 표를 복사했습니다.');
});

/* 월 표를 그려 PNG로 저장 */
$('#imgM').addEventListener('click', function(){
  collect();
  var t = PW3.serveTeam(team);
  var dates = PW3.sundaysOf(yy, mm);
  var C0 = 110, CW = t.dual ? 190 : 160, PAD = 28, HROW = 46, ROW = t.dual ? 54 : 46;
  var W = PAD*2 + C0 + CW*t.parts.length;
  var TOP = 86;
  var H = TOP + HROW + ROW*dates.length + PAD;
  var c = document.createElement('canvas'), r = 2;
  c.width = W*r; c.height = H*r;
  var g = c.getContext('2d'); g.scale(r,r);
  g.fillStyle = '#ffffff'; g.fillRect(0,0,W,H);
  g.fillStyle = '#191f28'; g.font = '800 26px Pretendard, sans-serif';
  g.fillText(String(yy).slice(2)+'.'+(mm<10?'0':'')+mm+' '+t.label+' 섬김표', PAD, 48);

  var x0 = PAD, y0 = TOP;
  g.fillStyle = '#f2f4f6'; g.fillRect(x0, y0, C0 + CW*t.parts.length, HROW);
  g.fillStyle = '#4e5968'; g.font = '700 15px Pretendard, sans-serif';
  g.fillText('섬김 날짜', x0+12, y0+29);
  t.parts.forEach(function(p, i){ g.fillText(p.name, x0+C0+CW*i+12, y0+29); });

  dates.forEach(function(date, ri){
    var y = y0 + HROW + ROW*ri;
    var sv = PW3.findServe(state.serves, team, date);
    var slots = sv ? sv.slots : {};
    g.strokeStyle = '#eef1f4'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(x0, y); g.lineTo(x0 + C0 + CW*t.parts.length, y); g.stroke();
    g.fillStyle = '#191f28'; g.font = '700 15px Pretendard, sans-serif';
    g.fillText(PW3.mdLabel(date), x0+12, y+ROW/2+5);
    t.parts.forEach(function(p, i){
      var txt = PW3.cellText(slots, p.name);
      g.fillStyle = txt ? '#191f28' : '#b0b8c1';
      g.font = (txt ? '600 ' : '500 ') + '15px Pretendard, sans-serif';
      g.fillText(txt || '－', x0+C0+CW*i+12, y+ROW/2+5);
    });
  });
  g.strokeStyle = '#dfe3e8';
  g.strokeRect(x0, y0, C0 + CW*t.parts.length, HROW + ROW*dates.length);

  c.toBlob(function(blob){
    if(!blob){ note('이미지 생성 실패','err'); return; }
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url;
    a.download = 'PW3_' + t.label + '_' + yy + '-' + (mm<10?'0':'') + mm + '.png';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
    note('이미지를 저장했습니다.');
  }, 'image/png');
});

PW3.load(function(err, s){
  state = s;
  setStatus(err ? '오프라인' : '저장됨', err ? 'err' : '');
  render();
});
})();
</script>
</body>
</html>
